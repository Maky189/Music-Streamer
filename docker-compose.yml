services:
  db:
    build: ./setup
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ${HOME}/Music:/music:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: music
      PGPASSWORD: music
      PGDATABASE: music
      PORT: 3001
      MUSIC_DIR: /music
    volumes:
      - ${HOME}/Music:/music:ro
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  dbdata:
